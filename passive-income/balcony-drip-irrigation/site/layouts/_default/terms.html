{{ define "main" }}
<section class="section">
  <div class="wrap">
    <header class="section-header">
      <div>
        <span class="kicker">{{ .Data.Singular | title }}</span>
        <h1 class="section-header__title">{{ .Title }}</h1>
        <p class="section-header__subtitle">{{ len .Pages }} articles tagged.</p>
      </div>
    </header>
    <div class="cats-grid" style="grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));">
      {{- range .Pages }}
      {{ partial "article-card.html" (dict "page" . "variant" "default") }}
      {{- end }}
    </div>
  </div>
</section>
{{ end }}
