name: Deploy to Cloudflare Pages

# Requires GitHub Actions secret CLOUDFLARE_API_TOKEN.
# If the secret is absent, Hugo build and static QA still run, then deploy is skipped.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3.2.1
        with:
          hugo-version: '0.68.3'
          extended: true

      - name: Build
        run: hugo --gc --minify --cleanDestinationDir
        env:
          CF_PAGES_BRANCH: ${{ github.ref_name }}
          CF_PAGES_COMMIT_SHA: ${{ github.sha }}

      - name: Static QA
        run: python3 scripts/qa_static_build.py

      - name: Promotion URL verifier tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check Cloudflare token
        id: cloudflare-token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not configured. Build passed, but deploy is being skipped."
            echo "deploy_enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.cloudflare-token.outputs.deploy_enabled == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: a7517de3b29da43874099ddb6669bfc3
          command: pages deploy public --project-name=balcony-drip-guide --branch=${{ github.ref_name }}
