name: Deploy to Cloudflare Pages

# ⚠️ OWNER ACTION REQUIRED:
# This workflow needs a Cloudflare API token to deploy.
# 1. Go to https://dash.cloudflare.com/profile/api-tokens
# 2. Create a token with these permissions:
#    - Zone:Read (for your domain zone)
#    - Cloudflare Pages:Edit (for the balcony-drip-guide project)
# 3. Go to GitHub repo → Settings → Secrets → Actions
# 4. Add repository secret named: CLOUDFLARE_API_TOKEN
# Without this secret, the deploy step will fail with:
# "In a non-interactive environment, it's necessary to set a CLOUDFLARE_API_TOKEN"

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.68.3'
          extended: true

      - name: Build
        run: hugo --gc --minify
        env:
          CF_PAGES_BRANCH: ${{ github.ref_name }}
          CF_PAGES_COMMIT_SHA: ${{ github.sha }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: a7517de3b29da43874099ddb6669bfc3
          command: pages deploy public --project-name=balcony-drip-guide --branch=master
