<header class="nav" data-open="false">
  <div class="nav__inner wrap">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="{{ .Site.Title }} home">
      <span class="brand__mark" aria-hidden="true"></span>
      <span>{{ .Site.Title }}</span>
    </a>

    <nav class="nav__links" aria-label="Primary">
      {{- range .Site.Params.categories }}
      <a href="{{ printf "/%s/" .slug | relURL }}"
        {{- if hasPrefix $.RelPermalink (printf "/%s/" .slug) }} aria-current="page"{{ end }}>
        {{ .name }}
      </a>
      {{- end }}
      <a href="{{ "/about/" | relURL }}"
        {{- if hasPrefix .RelPermalink "/about" }} aria-current="page"{{ end }}>About</a>
    </nav>

    <div class="nav__actions">
      <button class="icon-btn theme-toggle" type="button"
        data-theme-toggle aria-label="Toggle dark mode">
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M16.5 11.5A6.5 6.5 0 0 1 8.5 3.5 6.5 6.5 0 1 0 16.5 11.5Z"/>
        </svg>
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="10" cy="10" r="3.5"/>
          <path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M4.2 15.8l1.4-1.4M14.4 5.6l1.4-1.4"/>
        </svg>
      </button>
      <a class="icon-btn" href="{{ "/search/" | relURL }}" aria-label="Search">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="9" r="5.5"/><path d="m13.5 13.5 3 3"/>
        </svg>
      </a>
      <button class="icon-btn nav__menu-btn" type="button"
        data-nav-toggle aria-label="Menu" aria-expanded="false" aria-controls="nav-drawer">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <path d="M3 6h14"/><path d="M3 10h14"/><path d="M3 14h14"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="nav__drawer" id="nav-drawer">
    {{- range .Site.Params.categories }}
    <a href="{{ printf "/%s/" .slug | relURL }}">{{ .name }}</a>
    {{- end }}
    <a href="{{ "/about/" | relURL }}">About</a>
    <a href="{{ "/disclosure/" | relURL }}">Disclosure</a>
  </div>
</header>
