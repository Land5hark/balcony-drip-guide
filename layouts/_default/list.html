<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }} | {{ .Site.Title }}</title>
    <meta name="description" content="{{ .Site.Params.description }}" />
    <link rel="canonical" href="{{ .Permalink }}" />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <meta property="og:title" content="{{ .Title }} | {{ .Site.Title }}" />
    <meta property="og:description" content="{{ .Site.Params.description }}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ .Permalink }}" />
    <meta property="og:image" content="{{ .Site.Params.site_url }}assets/logo.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="{{ .Title }} | {{ .Site.Title }}" />
    <meta name="twitter:description" content="{{ .Site.Params.description }}" />
    <meta name="twitter:image" content="{{ .Site.Params.site_url }}assets/logo.png" />
    <style>
      body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.65; color: #18303a; background: #f6fbfc; }
      a { color: #0e5a73; text-decoration: none; }
      a:hover { text-decoration: underline; }
      main { max-width: 820px; margin: 0 auto; padding: 28px 18px 56px; }
      .shell { background: #fff; border: 1px solid #d9e8ea; border-radius: 20px; padding: 26px; box-shadow: 0 10px 28px rgba(16, 59, 74, 0.06); }
      ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
      li { background: #f9fcfc; border: 1px solid #d9e8ea; border-radius: 14px; padding: 14px 16px; }
    </style>
    {{ with .Site.Params.cloudflare_analytics_token }}
    <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "{{ . }}"}'></script>
    {{ end }}
  </head>
  <body>
    <main>
      <div class="shell">
        <p><a href="/">← Home</a></p>
        <h1>{{ .Title }}</h1>
        <ul>
          {{ range .Pages.ByDate.Reverse }}
            <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
          {{ end }}
        </ul>
      </div>
    </main>
  </body>
</html>
